# ===== 服务器端口 =====
server:
  port: 8080
  # 优雅停机：SIGTERM 后等待在途审查任务完成，避免任务丢失（配合 spring.lifecycle 超时）
  shutdown: graceful

# ===== GitLab 对接配置 =====
# 填入你的 GitLab 实例地址 + Personal Access Token（需 api 权限），
# 即可接收 Webhook 并自动审查 Merge Request。
# 未配置 api-token 时，系统仍可启动但不会处理 GitLab Webhook。
gitlab:
  # GitLab 实例地址（自建 GitLab 填 https://gitlab.your-company.com；SaaS填 https://gitlab.com）
  base-url: https://gitlab.com
  # Personal Access Token，需勾选 api scope
  api-token: ""
  # Webhook Secret Token（在 GitLab Webhook 设置页配置的，用于校验请求来源合法性）
  webhook-secret: ""
  # 是否启用 GitLab 接入（设为 true 后注册相关 Bean）
  enabled: false

# ===== Gitea 对接配置（轻量方案，本地 Docker 运行）=====
# 与 GitLab 配置二选一启用。填入 Gitea 地址 + Access Token，
# 即可接收 Webhook 并自动审查 Pull Request。
# 注意：enabled=true 时才会注册 /webhook/gitea 控制器；
# IDEA 本地 debug 也直接生效（无需额外传参），改配置后需重启应用。
gitea:
  # Gitea 实例地址（本地 Docker 启动默认为 http://localhost:3000；生产通过 GITEA_BASE_URL 注入）
  base-url: ${GITEA_BASE_URL:http://localhost:3000}
  # Access Token 通过环境变量或 Secret 注入，禁止提交明文凭证
  api-token: ${GITEA_API_TOKEN:}
  # Webhook 密钥（在 Gitea 仓库 Webhook 设置里填同一个值，用于 HMAC-SHA256 签名校验；
  # 生产环境必须配置，与 Gitea Webhook 侧保持一致
  webhook-secret: ${GITEA_WEBHOOK_SECRET:}
  # 生产环境强制要求签名一致：不允许无签名请求。dev 覆盖为 true 以便本地联调。
  webhook-allow-unsigned: false
  # 是否启用 Gitea 接入（设为 true 后注册相关 Bean）
  enabled: true

# ===== TokenHub 大模型配置（腾讯云大模型服务平台，OpenAI 兼容协议）=====
# 申请入口：https://console.cloud.tencent.com/tokenhub/ （注册腾讯云 + 实名认证 → 开通服务
# → 模型广场领免费体验包 → API Key 管理创建 Key，格式 sk-xxx，只显示一次）。
# 关键：同一个 API Key 可调用平台上所有模型，仅需切换 model 字段。
# 下方 models 列表按顺序声明要用的模型；某模型超时/失败时网关自动 failover 到下一个。
# 注意：本系统不提供任何 Mock 兜底（2026-09-03 已全量移除）——未配置 api-key 将直接启动失败，
# 所有供应商失败时对应 Agent 会被标记为降级并在报告顶部告警，绝不产生「看起来通过」的假报告。
tokenhub:
  # API Key 通过环境变量或 Secret 注入，禁止提交明文凭证
  api-key: ${TOKENHUB_API_KEY:}
  # OpenAI 兼容接入点
  base-url: https://tokenhub.tencentmaas.com/v1
  # 单次请求超时（秒）
  timeout-seconds: 60
  # 网关每分钟总配额
  quota-per-minute: 200
  # 模型列表：name=网关内供应商名（日志/路由），model=TokenHub 模型调用参数
  models:
    - name: hunyuan
      model: hy3
    - name: deepseek
      model: deepseek-v4-flash
    - name: glm
      model: glm-5.2

# ===== 公司级 Token 工厂接入 =====
# 工厂负责：统一鉴权（真实厂商 Key 只在工厂侧）、额度控制、供应商路由/熔断/重试、计价与计量。
# 本系统接入后只持有工厂签发的 AK，不再自管厂商密钥。
#
# 工作方式（enabled=true 时）：
#   1. 候选供应商列表首位插入「token-factory:<alias>」，请求打到工厂 /v1/chat/completions；
#   2. 工厂不可用/超额/上游全挂时，由 ModelGateway 天然 failover 到下方 tokenhub 直连供应商；
#   3. 直连期间的用量由 UsageReportingProvider 事后补报回工厂（report-direct-usage=false 则产生账缺口）。
#
# 默认关闭：不配置即完全不生效，行为与接入前一致（关掉就彻底没有，避免半接不接的模糊状态）。
# 启用但没配 access-key 会直接启动失败——宁可起不来，也不要「以为走工厂其实一直在降级」。
token-factory:
  enabled: ${TOKEN_FACTORY_ENABLED:false}
  base-url: ${TOKEN_FACTORY_BASE_URL:http://localhost:8090}
  # 工厂签发的 access key，只通过环境变量注入
  access-key: ${TOKEN_FACTORY_KEY:}
  # 上报给工厂的应用标识（工厂侧按 app 维度拆分用量）
  app-id: code-review-agent
  # 工厂侧的模型别名（工厂负责把它路由到真实供应商）
  alias: ${TOKEN_FACTORY_ALIAS:default}
  # true=工厂优先（失败才回落直连）；false=直连优先，工厂只做备用
  priority: ${TOKEN_FACTORY_PRIORITY:true}
  # 直连上游时是否把用量补报回工厂
  report-direct-usage: ${TOKEN_FACTORY_REPORT_USAGE:true}
  timeout-seconds: 120
  connect-timeout-ms: 3000

# ===== PostgreSQL + pgvector 配置 =====
# enabled=true 时使用 PostgreSQL + pgvector 持久化记忆；false 回退到内存
pgvector:
  enabled: true
  host: ${PGVECTOR_HOST:localhost}
  port: ${PGVECTOR_PORT:5432}
  database: ${PGVECTOR_DATABASE:codereview}
  # 生产环境务必通过环境变量注入用户名/密码（PGVECTOR_USERNAME / PGVECTOR_PASSWORD），不要写死
  username: ${PGVECTOR_USERNAME:yunfei}
  password: ${PGVECTOR_PASSWORD:}
  # 默认 profile 使用 SimpleHashEmbeddingClient，必须使用 256 维；
  # dev profile 开启真实 Embedding 时覆盖为 1024 维。
  vector-dim: ${PGVECTOR_VECTOR_DIM:256}

# ===== Redis 配置 =====
# enabled=true 时使用 Redis 作为消息队列；false 回退到内存
redis:
  enabled: true
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:2000}
  so-timeout-ms: ${REDIS_SO_TIMEOUT_MS:30000}

# ===== 审查调度配置 =====
review:
  # 对外文案语言（zh=中文默认 / en=English），作用于审查报告/修复建议/质量报告等开发者可见输出
  lang: ${REVIEW_LANG:zh}
  # 生产级并发边界，避免任务无限堆积到 JVM
  concurrency:
    webhook-threads: ${REVIEW_WEBHOOK_THREADS:8}
    webhook-queue-capacity: ${REVIEW_WEBHOOK_QUEUE_CAPACITY:2000}
    review-threads: ${REVIEW_REVIEW_THREADS:32}
    review-queue-capacity: ${REVIEW_REVIEW_QUEUE_CAPACITY:1000}
    agent-threads: ${REVIEW_AGENT_THREADS:64}
    agent-queue-capacity: ${REVIEW_AGENT_QUEUE_CAPACITY:512}
    io-threads: ${REVIEW_IO_THREADS:32}
    io-queue-capacity: ${REVIEW_IO_QUEUE_CAPACITY:1000}
    max-inflight-per-tenant: ${REVIEW_MAX_INFLIGHT_PER_TENANT:20}
    max-inflight-global: ${REVIEW_MAX_INFLIGHT_GLOBAL:500}
  agent:
    # Coordinator 整体审查超时（毫秒），默认 5 分钟
    timeout-ms: ${REVIEW_AGENT_TIMEOUT_MS:300000}
  # 数据目录：误报反馈、审查历史的本地 JSON 持久化位置（不可写时自动回退内存）
  data-dir: ./data
  # 人工介入与监控接口（/api/feedback、/api/quality-report）开关
  api:
    enabled: true
    # API 访问令牌：保护 /api/**（含 /api/admin/**）的 Bearer 令牌，
    # 生产必须通过环境变量 REVIEW_API_TOKEN 注入；留空则零鉴权放行（仅限本地 dev）。
    auth-token: ${REVIEW_API_TOKEN:}
  # ===== 多租户（团队）隔离配置 =====
  # 系统采用「全局基线 + 团队叠加」模型：内置技能与基础编码规范（__global__）所有团队共享；
  # 自定义规则 / 知识 / 记忆 / 历史 / 反馈按 teamId 隔离（数据落在 data-dir/<teamId>/ 下）。
  # 仓库 → 团队映射：精确匹配 owner/repo 优先，其次匹配 owner（整组织），均未命中回退 default。
  teams:
    # 未匹配任何映射的仓库归属的默认团队
    default: default
    # 仓库 owner（组织）或 owner/repo → 团队映射
    # 示例：
    #   "acme": team-acme                # 整个组织 acme 归 team-acme
    #   "acme/payments": team-acme-pay   # 更具体的仓库优先
    #   "opensource/tool-x": team-oss
    mapping: {}
  # ===== LangChain4j 向量化配置 =====
  # enabled=true 时，RAG/语义注入检测的嵌入计算切换为 LangChain4j OpenAiEmbeddingModel
  # （OpenAI 兼容协议，复用上方 tokenhub.api-key / base-url）。
  # 已实测 TokenHub 可用嵌入模型：kinfra-text-embedding-0.6b(1024维) / kinfra-text-embedding-4b(2560维)。
  # 默认用 0.6b：pgvector ivfflat 索引上限 2000 维，4b 无法建索引；
  # 切换模型时需同步把 pgvector.vector-dim 改为对应维度（存量表会自动迁移重建向量列）。
  llm:
    gateway:
      # 熔断器：连续失败 N 次 → OPEN 30s；OPEN 期间快速失败，避免对已知不健康供应商继续浪费 RTT。
      circuit-breaker:
        enabled: ${LLM_CB_ENABLED:true}
        failure-threshold: ${LLM_CB_FAILURE_THRESHOLD:5}
        open-seconds: ${LLM_CB_OPEN_SECONDS:30}
        half-open-max-trials: ${LLM_CB_HALF_OPEN_MAX_TRIALS:1}
      # 重试退避：临时错误（429/503/timeout）在本供应商上指数退避重试；
      # 永久错误（401/403/参数错）立即切换到下一家。
      retry:
        enabled: ${LLM_RETRY_ENABLED:true}
        max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
        initial-backoff-ms: ${LLM_RETRY_INITIAL_BACKOFF_MS:200}
        max-backoff-ms: ${LLM_RETRY_MAX_BACKOFF_MS:2000}
        backoff-multiplier: ${LLM_RETRY_BACKOFF_MULTIPLIER:2.0}
    embedding:
      # 默认 true：有 TokenHub Key 时使用真实语义向量（业界最佳实践，检索质量远超哈希词袋）；
      # 无 Key 时自动降级 SimpleHashEmbeddingClient（离线哈希），保证链路不中断。
      enabled: true
      # dev profile 覆盖为 true，并使用真实 TokenHub Embedding。
      base-url: ""
      api-key: ""
      model: kinfra-text-embedding-0.6b
      # 仅用于日志/维度对齐提示，不传给模型（TokenHub 不支持 dimensions 参数）
      dim: 1024

  # ===== RAG 高级检索配置（对标业界最佳实践）=====
  # 混合检索（向量 + BM25）已在 KnowledgeStore 实现中默认开启（无需开关）；
  # 以下控制重排与阈值过滤。
  rag:
    # Cross-Encoder 重排（质量闸门）：默认开启（enabled=true），但 api-key 为空时
    # ApiReranker 自动降级到 HeuristicReranker（离线可用，绝不阻断审查链路）。
    # 生产建议配置 Cohere/Jina：将 RERANK_API_KEY 注入且填 base-url。
    rerank:
      enabled: ${RERANK_ENABLED:true}
      provider: cohere          # cohere | jina
      base-url: ${RERANK_BASE_URL:https://api.cohere.com/v2/rerank}
      api-key: ${RERANK_API_KEY:}
      model: ${RERANK_MODEL:rerank-english-v3.0}
      timeout-ms: 5000
    # 相似度阈值：低于此值的候选块不注入 prompt（选择性回答 abstain，抑制噪声）。
    # 0.0 表示不拦截；真实向量下建议 0.2~0.4（已设为 0.3 启用 abstain）。
    min-similarity: ${RAG_MIN_SIMILARITY:0.3}
    # 是否记录 ground-truth 召回评估指标（需候选携带 expectedId 元数据）；
    # true 时 RagEvaluator 在 evalEnabled 下计算 precision/recall，配合回归基线。
    eval-enabled: ${RAG_EVAL_ENABLED:true}

  # ===== 受控出口（Egress）配置 =====
  # 大厂「显式出口管控」实践：每个外部 SaaS 依赖（LLM / Rerank）各自声明出口方式，
  # 互不干扰，也绝不劫持内部服务（PostgreSQL / Redis / Gitea 始终直连，与本段无关）。
  # 取代原先脆弱的全局 bypass-system-proxy 布尔。
  #
  # 三种模式（EgressMode）：
  #   direct  : 强制直连（忽略系统代理）。【生产默认】服务器在合规网络内直接出网，
  #             或 base-url 指向公司内部 AI Gateway（Envoy AI Gateway / LiteLLM Proxy 等），
  #             由网关统一持有供应商 key、做限流/重试/计费/审计——业务代码零 key、零供应商耦合。
  #   system  : 继承 JVM 系统代理（http.proxyHost 等）。仅确实需要走机器级代理出网时使用。
  #   proxy   : 仅本出站请求走显式 proxy-url（如开发机 Clash http://127.0.0.1:52320），
  #             精准代理单个外部依赖，不劫持 localhost。
  #
  # 生产凭证：RERANK_API_KEY / TOKENHUB_API_KEY 务必由 Secret Manager（Vault / AWS Secrets Manager /
  # Doppler）注入环境变量，绝不入库。
  egress:
    llm:
      mode: ${EGRESS_LLM_MODE:direct}
    rerank:
      mode: ${EGRESS_RERANK_MODE:direct}
      # 仅 mode=proxy 时生效；开发机经 Clash 出网可设 RERANK_PROXY=http://127.0.0.1:52320
      proxy-url: ${RERANK_PROXY:}

# ===== 演示模式 =====
# 设为 true 时启动后执行硬编码样例审查（不走 Webhook）；默认关闭
demo:
  runner:
    enabled: false

logging:
  # 全链路追踪：每行日志携带 traceId（由 TraceContext 写入 MDC），
  # 据 traceId 可在海量日志中还原一次完整审查的调用链（Webhook→协调器→子Agent→LLM→向量库→Gitea）。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-N/A}] %-40.40logger{39} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-N/A}] %-40.40logger{39} : %msg%n"
  level:
    com.codereview.agent: INFO
    # 调试混元调用时可改为 DEBUG 查看请求/返回摘要
    # com.codereview.agent.core.llm: DEBUG

# ===== 优雅停机超时（与 server.shutdown=graceful 配合）=====
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ===== 健康检查端点 =====
# 零依赖实现：GET /health 与 /actuator/health 返回 200(UP)/503(DOWN)，
# 供容器编排（k8s/Docker）做存活/就绪探针。状态聚合 PG(pgvector) 与 Redis 连通性。
