br />return findings（不过滤）<br />→ 全量展示</p></span></div></foreignObject></g></g><g class="node default abs" id="svg-11-2-flowchart-AB-3" data-look="classic" transform="translate(303, 665)"><rect class="basic label-container" style="fill:#EEF2FF !important;stroke:#1d4ed8 !important;stroke-width:2px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#1e3a8a !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(30, 58, 138) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1e3a8a !important" class="nodeLabel"><p>abstract apply(findings) → List&lt;Finding&gt;<br />← 枚举里的抽象方法<br />每个常量各自实现</p></span></div></foreignObject></g></g><g class="node default note" id="svg-11-2-flowchart-NOTE-6" data-look="classic" transform="translate(138, 392)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-135" width="260" height="270"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>为什么用枚举方法而非 switch?<br />纯策略 + 无外部状态 → 枚举方法更优<br />新增档位 = 加一个常量，不改任何 switch<br />对比 ToolGate 那个 switch 是对的<br />（那里有 deferredEnabled 外部状态）</p></span></div></foreignObject></g></g><g class="node default note" id="svg-11-2-flowchart-NOTE2-9" data-look="classic" transform="translate(1048.8515625, 95)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>SUGGEST 不过滤，但调用处有短路<br />if profile != SUGGEST 才调 apply<br />→ SUGGEST 时跳过过滤方法</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="svg-11-2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="svg-11-2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>