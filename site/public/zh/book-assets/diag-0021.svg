6)"><rect/><foreignObject width="136.046875" height="72"><div style="color: rgb(82, 96, 109) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#52606d !important" class="nodeLabel"><p>tools : ToolRegistry<br />可用工具（可空）<br />装配时注入</p></span></div></foreignObject></g></g><g class="node default note" id="svg-08-2-flowchart-NOTE-13" data-look="classic" transform="translate(591.08984375, 119)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>为什么 history 和 state 要分开?<br />history = 自然语言交互流（给模型看）<br />state = 结构化数据（给代码用）<br />混在一起 = 模型看到无关数据 / 代码解析自然语言</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="svg-08-2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="svg-08-2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>