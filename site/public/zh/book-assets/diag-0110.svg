 rgb(30, 58, 138) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1e3a8a !important" class="nodeLabel"><p>GatewayConfig<br />&lt;&gt; @Configuration<br />唯一的 Spring 装配点</p></span></div></foreignObject></g></g><g class="node default bean" id="my-svg-flowchart-B1-1" data-look="classic" transform="translate(136.125, 507)"><rect class="basic label-container" style="fill:#F7FAFC !important;stroke:#9aa5b1 !important;stroke-width:1px !important" x="-128.125" y="-51" width="256.25" height="102"/><g class="label" style="color:#334e68 !important" transform="translate(-98.125, -36)"><rect/><foreignObject width="196.25" height="72"><div style="color: rgb(51, 78, 104) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#334e68 !important" class="nodeLabel"><p>@Bean backoffPolicy(...)<br />退避策略<br />base/multiplier/max/jitter</p></span></div></foreignObject></g></g><g class="node default bean" id="my-svg-flowchart-B2-2" data-look="classic" transform="translate(441.078125, 507)"><rect class="basic label-container" style="fill:#F7FAFC !important;stroke:#9aa5b1 !important;stroke-width:1px !important" x="-126.828125" y="-39" width="253.65625" height="78"/><g class="label" style="color:#334e68 !important" transform="translate(-96.828125, -24)"><rect/><foreignObject width="193.65625" height="48"><div style="color: rgb(51, 78, 104) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#334e68 !important" class="nodeLabel"><p>@Bean breakerRegistry(...)<br />熔断注册表</p></span></div></foreignObject></g></g><g class="node default key" id="my-svg-flowchart-B3-3" data-look="classic" transform="translate(747.90625, 507)"><rect class="basic label-container" style="fill:#FDF6E3 !important;stroke:#B8860B !important;stroke-width:1.5px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#5A4200 !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(90, 66, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#5A4200 !important" class="nodeLabel"><p>@Bean routingEngine(...)<br />★ 路由引擎<br />注入 routes + upstreams<br />+ strategy + backoff + breaker</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-NOTE-10" data-look="classic" transform="translate(441.078125, 119)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>为什么需要唯一装配点?<br />内核组件（core 模块）是纯 POJO<br />不知道 Spring 存在<br />→ GatewayConfig 把它们装成 Bean<br />→ 改装配只改一个类，不动内核</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>