 class="node default note" id="svg-10-4-flowchart-NOTE-3" data-look="classic" transform="translate(138, 319)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>枚举只有两个值，文档说三层<br />不一致 = 多来源真相的典型信号<br />第三层不是枚举的职责，而是独立子系统<br />→ 按枚举理解架构会漏掉第三层</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="svg-10-4-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="svg-10-4-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>