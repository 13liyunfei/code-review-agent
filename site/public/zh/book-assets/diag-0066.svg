 transform="translate(175.5, 106)"><rect class="basic label-container" style="fill:#F7FAFC !important;stroke:#9aa5b1 !important;stroke-width:1px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#334e68 !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(51, 78, 104) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#334e68 !important" class="nodeLabel"><p>nothingToDo()<br />requested=0 published=0 failed=false<br />= 无事可做</p></span></div></foreignObject></g></g><g class="node default fac" id="my-svg-flowchart-F2-2" data-look="classic" transform="translate(175.5, 282)"><rect class="basic label-container" style="fill:#F7FAFC !important;stroke:#9aa5b1 !important;stroke-width:1px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#334e68 !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(51, 78, 104) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#334e68 !important" class="nodeLabel"><p>ok(n)<br />requested=n published=n failed=false<br />= 成功</p></span></div></foreignObject></g></g><g class="node default fac" id="my-svg-flowchart-F3-3" data-look="classic" transform="translate(175.5, 458)"><rect class="basic label-container" style="fill:#F7FAFC !important;stroke:#9aa5b1 !important;stroke-width:1px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#334e68 !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(51, 78, 104) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#334e68 !important" class="nodeLabel"><p>failed(n, why)<br />requested=n published=0 failed=true<br />= 做了但失败</p></span></div></foreignObject></g></g></g></g><g class="node default rec" id="my-svg-flowchart-R-0" data-look="classic" transform="translate(175.5, 319)"><rect class="basic label-container" style="fill:#EEF2FF !important;stroke:#1d4ed8 !important;stroke-width:2px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#1e3a8a !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(30, 58, 138) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1e3a8a !important" class="nodeLabel"><p>PublishResult<br />&lt;&gt; 行内评论发布结果<br />用类型表达语义，不用 int 特殊值</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-NOTE-6" data-look="classic" transform="translate(175.5, 107)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>为什么不用 int 返回值?<br />改前：无事可做和做了但失败都返回 0<br />→ 调用方无法区分两种情况<br />改后：工厂方法让语义在类型层面可区分<br />→ 日志/告警能精确区分</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id