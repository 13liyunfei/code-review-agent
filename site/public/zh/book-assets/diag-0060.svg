 : int<br />★ 新增 · 抑制计数<br />→ 向后兼容：老记录缺失补 0 或 -1<br />→ -1 = 未知，别混进确实没抑制</p></span></div></foreignObject></g></g><g class="node default note" id="my-svg-flowchart-NOTE-13" data-look="classic" transform="translate(928.984375, 131)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>补 0 还是 -1?<br />0 = 确实没抑制 / -1 = 未知（无此字段时代）<br />→ 用 -1 可在算比率时排除，不混进分母<br />= 第 17 讲 NaN 而非 0 的同一原则：<br />没有数据 和 数据是零 必须可区分</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>