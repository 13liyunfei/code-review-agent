div></foreignObject></g></g></g></g><g class="node default note" id="my-svg-flowchart-NOTE-4" data-look="classic" transform="translate(175.5, 83)"><rect class="basic label-container" style="fill:#FDF6E3 !important;stroke:#B8860B !important;stroke-width:1.5px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#5A4200 !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(90, 66, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#5A4200 !important" class="nodeLabel"><p>注释里的对齐是愿望，不是约束<br />要让它成为约束：<br />① 一方引用另一方<br />② 抽到共享常量类</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>