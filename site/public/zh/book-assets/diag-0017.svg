ant" transform="translate(-59.421875, -24)"><rect/><foreignObject width="118.84375" height="48"><div style="color: rgb(30, 90, 30) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1E5A1E !important" class="nodeLabel"><p>ReviewResultDto<br />→ findings : List</p></span></div></foreignObject></g></g><g class="node default dto" id="svg-06-2-flowchart-RF-5" data-look="classic" transform="translate(293, 648)"><rect class="basic label-container" style="fill:#F6FEF6 !important;stroke:#2c7d2c !important;stroke-width:1.5px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="color:#1E5A1E !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(30, 90, 30) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1E5A1E !important" class="nodeLabel"><p>ReviewFindingDto<br />→ ruleId · title · description<br />→ suggestion · severity · file<br />→ line · confidence</p></span></div></foreignObject></g></g><g class="node default note" id="svg-06-2-flowchart-NOTE-10" data-look="classic" transform="translate(448, 259)"><rect class="basic label-container" style="fill:#F0F4F8 !important;stroke:#486581 !important;stroke-width:1px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="color:#102A43 !important" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div style="color: rgb(16, 42, 67) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#102A43 !important" class="nodeLabel"><p>为什么 record 包 List?<br />AiServices 返回类型必须是单个对象<br />→ 不知道这个约束会试一小时<br />为什么不用 List 直接返？<br />→ 框架限制，不是设计偏好</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="svg-06-2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="svg-06-2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>