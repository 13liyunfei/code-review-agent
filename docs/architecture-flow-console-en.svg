<svg viewBox="0 0 680 1180" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <title>End-to-end Review Flow &amp; Admin Console Backend Links</title>
  <desc>Left: numbered swimlane from PR trigger to comment writeback; Right: console backend skills-duration / team-knowledge config links.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,sans-serif}
    .th{font-size:13px;font-weight:500;fill:#2C2C2A}
    .ts{font-size:11px;fill:#5F5E5A}
    .cap{font-size:11px;fill:#888780}
    .lay{font-size:14px;font-weight:600}
    .a{stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .d{stroke-width:1;fill:none;stroke-dasharray:5 4}
  </style>

  <text class="th" x="40" y="28" font-size="15">End-to-end Review Flow &amp; Admin Console Backend Links</text>
  <text class="ts" x="40" y="46">B1 realtime review swimlane (numbered steps) · B2 admin config &amp; team-knowledge links</text>

  <!-- B1 -->
  <text class="lay" x="40" y="74" fill="#0C447C">B1 · Realtime Review Swimlane</text>
  <rect x="40" y="84" width="120" height="640" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="100" y="104" text-anchor="middle" dominant-baseline="central">Gitea /</text>
  <text class="ts" x="100" y="120" text-anchor="middle" dominant-baseline="central">GitLab</text>
  <rect x="168" y="84" width="130" height="640" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="233" y="104" text-anchor="middle" dominant-baseline="central">Engine API</text>
  <text class="ts" x="233" y="120" text-anchor="middle" dominant-baseline="central">integration</text>
  <rect x="306" y="84" width="150" height="640" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="381" y="104" text-anchor="middle" dominant-baseline="central">Coord /</text>
  <text class="ts" x="381" y="120" text-anchor="middle" dominant-baseline="central">analysis</text>
  <rect x="464" y="84" width="176" height="640" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="ts" x="552" y="104" text-anchor="middle" dominant-baseline="central">LLM / RAG /</text>
  <text class="ts" x="552" y="120" text-anchor="middle" dominant-baseline="central">storage</text>

  <rect x="52" y="140" width="96" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5"/>
  <text class="ts" x="100" y="160" text-anchor="middle" dominant-baseline="central">① Push PR</text>
  <path class="a" d="M148 160 L168 160" stroke="#185FA5"/>
  <rect x="176" y="140" width="114" height="40" rx="8" fill="#9FE1CB" stroke="#1D9E75"/>
  <text class="ts" x="233" y="155" text-anchor="middle" dominant-baseline="central">② Webhook</text>
  <text class="ts" x="233" y="171" text-anchor="middle" dominant-baseline="central">verify signature</text>
  <path class="a" d="M290 160 L306 160" stroke="#1D9E75"/>
  <rect x="314" y="140" width="134" height="40" rx="8" fill="#CECBF6" stroke="#534AB7"/>
  <text class="ts" x="381" y="155" text-anchor="middle" dominant-baseline="central">③ resolve owner/repo</text>
  <text class="ts" x="381" y="171" text-anchor="middle" dominant-baseline="central">→ teamId · traceId</text>
  <path class="a" d="M381 180 L381 210" stroke="#534AB7"/>
  <rect x="314" y="210" width="134" height="44" rx="8" fill="#CECBF6" stroke="#534AB7"/>
  <text class="ts" x="381" y="226" text-anchor="middle" dominant-baseline="central">④ Coordinator parallel</text>
  <text class="ts" x="381" y="242" text-anchor="middle" dominant-baseline="central">5 built-in + custom</text>
  <path class="a" d="M381 254 L381 284" stroke="#BA7517"/>
  <rect x="314" y="284" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="ts" x="381" y="302" text-anchor="middle" dominant-baseline="central">⑤ 5 specialized Agents</text>
  <text class="ts" x="381" y="318" text-anchor="middle" dominant-baseline="central">Logic/Security/</text>
  <text class="ts" x="381" y="334" text-anchor="middle" dominant-baseline="central">Perf/Style/Arch</text>
  <path class="a" d="M448 312 L464 312" stroke="#5F5E5A"/>
  <rect x="472" y="284" width="160" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A"/>
  <text class="ts" x="552" y="300" text-anchor="middle" dominant-baseline="central">⑥ LLM inference</text>
  <text class="ts" x="552" y="316" text-anchor="middle" dominant-baseline="central">ModelGateway→TokenHub</text>
  <text class="ts" x="552" y="332" text-anchor="middle" dominant-baseline="central">RAG (vec+BM25)</text>
  <path class="a" d="M552 340 L552 372" stroke="#5F5E5A"/>
  <rect x="472" y="372" width="160" height="50" rx="8" fill="#D3D1C7" stroke="#5F5E5A"/>
  <text class="ts" x="552" y="388" text-anchor="middle" dominant-baseline="central">⑦ write results to PG</text>
  <text class="ts" x="552" y="406" text-anchor="middle" dominant-baseline="central">memory / knowledge vec</text>
  <path class="a" d="M472 397 L448 397" stroke="#534AB7"/>
  <path class="a" d="M448 397 L448 430" stroke="#534AB7"/>
  <path class="a" d="M448 430 L314 430" stroke="#534AB7"/>
  <rect x="314" y="430" width="134" height="48" rx="8" fill="#CECBF6" stroke="#534AB7"/>
  <text class="ts" x="381" y="446" text-anchor="middle" dominant-baseline="central">⑧ aggregate/dedup/arb</text>
  <text class="ts" x="381" y="464" text-anchor="middle" dominant-baseline="central">tiering · AutoFix</text>
  <path class="a" d="M381 478 L381 508" stroke="#534AB7"/>
  <rect x="314" y="508" width="134" height="48" rx="8" fill="#CECBF6" stroke="#534AB7"/>
  <text class="ts" x="381" y="524" text-anchor="middle" dominant-baseline="central">⑨ ReportGenerator</text>
  <text class="ts" x="381" y="542" text-anchor="middle" dominant-baseline="central">build review report</text>
  <path class="a" d="M290 532 L168 532" stroke="#1D9E75"/>
  <rect x="176" y="512" width="114" height="48" rx="8" fill="#9FE1CB" stroke="#1D9E75"/>
  <text class="ts" x="233" y="528" text-anchor="middle" dominant-baseline="central">⑩ ReviewService</text>
  <text class="ts" x="233" y="546" text-anchor="middle" dominant-baseline="central">write comments/ticket</text>
  <path class="a" d="M168 536 L148 536" stroke="#185FA5"/>
  <rect x="52" y="516" width="96" height="48" rx="8" fill="#B5D4F4" stroke="#185FA5"/>
  <text class="ts" x="100" y="532" text-anchor="middle" dominant-baseline="central">⑪ inline comments</text>
  <text class="ts" x="100" y="550" text-anchor="middle" dominant-baseline="central">+ overview + ticket</text>
  <text class="cap" x="52" y="600">Every step logs [traceId];</text>
  <text class="cap" x="52" y="616">grep rebuilds the full chain</text>
  <text class="cap" x="52" y="636">and per-step timings.</text>

  <!-- B2 -->
  <text class="lay" x="40" y="752" fill="#993556">B2 · Admin Console Backend Links (code-review-console :8081)</text>
  <rect x="40" y="762" width="600" height="396" rx="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="56" y="784" fill="#72243E">Admin backend /api/admin/* (X-Team-Id routes to team-isolated data)</text>
  <rect x="58" y="796" width="180" height="44" rx="8" fill="#F4C0D1" stroke="#993556"/>
  <text class="th" x="148" y="816" text-anchor="middle" dominant-baseline="central">Console frontend</text>
  <text class="ts" x="148" y="832" text-anchor="middle" dominant-baseline="central">:8081 separate repo</text>
  <path class="a" d="M238 818 L272 818" stroke="#993556"/>
  <rect x="272" y="796" width="356" height="44" rx="8" fill="#F4C0D1" stroke="#993556"/>
  <text class="th" x="450" y="812" text-anchor="middle" dominant-baseline="central">Engine Admin API</text>
  <text class="ts" x="450" y="830" text-anchor="middle" dominant-baseline="central">SkillAdminController · KnowledgeController · StatsController · AgentAdminController</text>

  <rect x="58" y="856" width="268" height="104" rx="10" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="192" y="876" text-anchor="middle" fill="#72243E">Skills Mgmt</text>
  <text class="ts" x="68" y="896">• list / enable toggle</text>
  <text class="ts" x="68" y="914">• custom rule POST</text>
  <text class="ts" x="68" y="932">• YAML rule import</text>
  <text class="ts" x="68" y="950">• delete custom/{id}</text>
  <text class="ts" x="68" y="968" fill="#993556">• ⏱ duration / call stats</text>
  <rect x="342" y="856" width="268" height="104" rx="10" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="476" y="876" text-anchor="middle" fill="#72243E">Team Knowledge</text>
  <text class="ts" x="352" y="896">• upload doc POST</text>
  <text class="ts" x="352" y="914">• StructuredChunker</text>
  <text class="ts" x="352" y="932">  structure-aware split</text>
  <text class="ts" x="352" y="950">• vectorize → Pg index</text>
  <text class="ts" x="352" y="968">• drop / rebuild index</text>
  <rect x="58" y="972" width="268" height="104" rx="10" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="192" y="992" text-anchor="middle" fill="#72243E">Team Stats</text>
  <text class="ts" x="68" y="1012">• skillTotal/Enabled</text>
  <text class="ts" x="68" y="1030">• skillCustom count</text>
  <text class="ts" x="68" y="1048">• knowledgeTotal</text>
  <text class="ts" x="68" y="1066">• knowledgeIndexed</text>
  <rect x="342" y="972" width="268" height="104" rx="10" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="476" y="992" text-anchor="middle" fill="#72243E">Custom Agent List</text>
  <text class="ts" x="352" y="1012">• GET /api/agents list</text>
  <text class="ts" x="352" y="1030">• create / edit / delete</text>
  <text class="ts" x="352" y="1048">• enable / disable toggle</text>
  <text class="ts" x="352" y="1066" fill="#993556">• injection check · degrade · replay</text>

  <path class="d" d="M340 1076 L340 1088" stroke="#993556"/>
  <rect x="180" y="1088" width="320" height="40" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text class="th" x="340" y="1112" text-anchor="middle" fill="#27500A">Team knowledge base → RAG enhancement</text>

  <text class="cap" x="40" y="1140">Legend: solid = sync call · dashed = knowledge warmup/side enhancement · block = layer ownership</text>
</svg>
