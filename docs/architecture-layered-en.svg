<svg viewBox="0 0 680 1300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <title>code-review-agent — Layered Architecture (static structure)</title>
  <desc>Six layers top-down: Trigger, Integration, Coordination, Review Agents (5 built-in + custom parallel), Capability (incl. new Tool Calling / Planning / Reflection &amp; Eval / Extension), Infrastructure; cross-cutting concerns on the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,sans-serif}
    .th{font-size:13px;font-weight:500;fill:#2C2C2A}
    .ts{font-size:11px;fill:#5F5E5A}
    .cap{font-size:11px;fill:#888780}
    .lay{font-size:14px;font-weight:600}
    .a{stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  </style>

  <text class="th" x="40" y="28" font-size="15">code-review-agent — Layered Architecture (static structure)</text>
  <text class="ts" x="40" y="46">Open-source multi-agent code review engine · six layers + cross-cutting concerns (incl. agentic capabilities: tool calling / task planning / reflection &amp; eval / extensions)</text>

  <!-- LAYER 1 TRIGGER -->
  <rect x="40" y="64" width="600" height="74" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="lay" x="56" y="84" fill="#0C447C">① Trigger layer</text>
  <rect x="58" y="94" width="135" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="125" y="112" text-anchor="middle" dominant-baseline="central">Gitea PR Webhook</text>
  <rect x="205" y="94" width="135" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="272" y="112" text-anchor="middle" dominant-baseline="central">GitLab MR Webhook</text>
  <rect x="352" y="94" width="135" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="419" y="112" text-anchor="middle" dominant-baseline="central">Manual API / Console</text>
  <rect x="499" y="94" width="125" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="561" y="112" text-anchor="middle" dominant-baseline="central">IDE LSP entry</text>
  <path class="a" d="M340 138 L340 152" stroke="#185FA5"/>

  <!-- LAYER 2 INTEGRATION -->
  <rect x="40" y="152" width="600" height="92" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="lay" x="56" y="172" fill="#0F6E56">② Integration layer</text>
  <rect x="58" y="182" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="198" y="200" text-anchor="middle" dominant-baseline="central">Gitea integration</text>
  <text class="ts" x="198" y="218" text-anchor="middle" dominant-baseline="central">WebhookController · ApiClient · ReviewService</text>
  <rect x="352" y="182" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="492" y="200" text-anchor="middle" dominant-baseline="central">GitLab integration</text>
  <text class="ts" x="492" y="218" text-anchor="middle" dominant-baseline="central">WebhookController · ApiClient · ReviewService</text>
  <path class="a" d="M340 244 L340 258" stroke="#1D9E75"/>

  <!-- LAYER 3 COORDINATION -->
  <rect x="40" y="258" width="600" height="84" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="lay" x="56" y="278" fill="#534AB7">③ Coordination layer</text>
  <rect x="58" y="288" width="280" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="198" y="309" text-anchor="middle" dominant-baseline="central">CompletableFutureCoordinator</text>
  <rect x="352" y="288" width="280" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="492" y="303" text-anchor="middle" dominant-baseline="central">Parallel dispatch · aggregation · dedupe · arbitration</text>
  <text class="ts" x="492" y="319" text-anchor="middle" dominant-baseline="central">Optional: Planning DAG routing · tiering · partial failure</text>
  <path class="a" d="M340 342 L340 356" stroke="#534AB7"/>

  <!-- LAYER 4 AGENTS (5 built-in lanes + custom-agent lane) -->
  <rect x="40" y="356" width="600" height="124" rx="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="lay" x="56" y="376" fill="#854F0B">④ Review Agents · 5 built-in (tool-enhanced) + custom parallel</text>
  <rect x="58" y="386" width="108" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="112" y="406" text-anchor="middle" dominant-baseline="central">Logic</text>
  <rect x="176" y="386" width="108" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="230" y="406" text-anchor="middle" dominant-baseline="central">Security</text>
  <rect x="294" y="386" width="108" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="348" y="406" text-anchor="middle" dominant-baseline="central">Performance</text>
  <rect x="412" y="386" width="108" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="466" y="406" text-anchor="middle" dominant-baseline="central">Style</text>
  <rect x="530" y="386" width="98" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="579" y="406" text-anchor="middle" dominant-baseline="central">Architecture</text>
  <!-- tool enhancement decorator -->
  <text class="ts" x="58" y="432" fill="#854F0B">└ ToolEquippedAgent decorator (optional): ToolCallingLoop gathers intel before review, findings merged</text>
  <!-- custom agent lane -->
  <rect x="58" y="440" width="570" height="32" rx="8" fill="#FDF1F4" stroke="#D4537E" stroke-width="1"/>
  <text class="ts" x="70" y="450" fill="#993556">Business custom agents (0~N parallel)</text>
  <text class="ts" x="70" y="464">DeclarativeReviewAgent · CustomAgentStore · injection pre-check · degradable</text>
  <path class="a" d="M340 480 L340 494" stroke="#BA7517"/>

  <!-- LAYER 5 CAPABILITY -->
  <rect x="40" y="494" width="600" height="428" rx="14" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="lay" x="56" y="514" fill="#3B6D11">⑤ Capability layer (incl. new agentic capabilities)</text>
  <rect x="58" y="524" width="280" height="120" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="74" y="542" fill="#27500A">Core analysis &amp; auto-fix</text>
  <text class="ts" x="74" y="560">• AstAnalyzer / CallGraphAnalyzer</text>
  <text class="ts" x="74" y="578">• ScaScanner (SCA) · YamlRuleEngine</text>
  <text class="ts" x="74" y="596">• AdvancedAnalyzer (6-way aggregation)</text>
  <text class="ts" x="74" y="614">• AutoFixEngine + Sandbox probe</text>
  <text class="ts" x="74" y="632">• ImpactAnalyzer (RepoIndex dual-engine)</text>
  <rect x="352" y="524" width="280" height="120" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="368" y="542" fill="#27500A">RAG &amp; memory (rebuilt)</text>
  <text class="ts" x="368" y="560">• KnowledgeStore (in-memory/Pg)</text>
  <text class="ts" x="368" y="578">• StructuredChunker</text>
  <text class="ts" x="368" y="596">• Reranker: Cohere API + Heuristic</text>
  <text class="ts" x="368" y="614">• RagEvaluator recall eval</text>
  <text class="ts" x="368" y="632">• min-similarity gate · hybrid retrieval</text>
  <rect x="58" y="656" width="280" height="120" rx="10" fill="#FDF6E3" stroke="#BA7517" stroke-width="0.8"/>
  <text class="th" x="74" y="674" fill="#854F0B">Tool calling &amp; task planning (new)</text>
  <text class="ts" x="74" y="692">• ToolCallingLoop decision loop</text>
  <text class="ts" x="74" y="710">• MCP Client · tool ecosystem</text>
  <text class="ts" x="74" y="728">• TaskPlanner decomposes goal → DAG</text>
  <text class="ts" x="74" y="746">• DagExecutor topo-parallel · fail-skip</text>
  <text class="ts" x="74" y="764">• ChatSession multi-turn · streaming</text>
  <rect x="352" y="656" width="280" height="120" rx="10" fill="#FDF6E3" stroke="#BA7517" stroke-width="0.8"/>
  <text class="th" x="368" y="674" fill="#854F0B">Reflection · Eval · Extension (new)</text>
  <text class="ts" x="368" y="692">• ReflectionService distills experiences</text>
  <text class="ts" x="368" y="710">• LlmJudge + EvalDataset regression</text>
  <text class="ts" x="368" y="728">• StructuredChatModel structured output</text>
  <text class="ts" x="368" y="746">• ExtensionPoint + Registry pluggable</text>
  <text class="ts" x="368" y="764">• Checkpoint · HITL · model router</text>
  <rect x="58" y="788" width="280" height="120" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="74" y="806" fill="#27500A">Human-in-loop &amp; quality loop</text>
  <text class="ts" x="74" y="824">• ReviewWorkflowEngine</text>
  <text class="ts" x="74" y="842">• ReportGenerator + write-back</text>
  <text class="ts" x="74" y="860">• FeedbackStore / Calibration</text>
  <text class="ts" x="74" y="878">• Remediation tickets / Apply suggestions</text>
  <rect x="352" y="788" width="280" height="120" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="368" y="806" fill="#27500A">Cross-cutting · security &amp; resilience</text>
  <text class="ts" x="368" y="824">• security: injection detection/hardening</text>
  <text class="ts" x="368" y="842">• custom-agent: skeleton not overridable</text>
  <text class="ts" x="368" y="860">• degrade: 4-level degradation chain</text>
  <text class="ts" x="368" y="878">• permission: Veto policy</text>
  <path class="a" d="M340 922 L340 936" stroke="#639922"/>

  <!-- LAYER 6 INFRA -->
  <rect x="40" y="936" width="600" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="lay" x="56" y="956" fill="#444441">⑥ Infrastructure layer</text>
  <rect x="58" y="966" width="180" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="148" y="990" text-anchor="middle" dominant-baseline="central">PostgreSQL 17</text>
  <text class="ts" x="148" y="1010" text-anchor="middle" dominant-baseline="central">pgvector · team isolation</text>
  <text class="ts" x="148" y="1028" text-anchor="middle" dominant-baseline="central">memory_store / knowledge</text>
  <rect x="252" y="966" width="170" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="337" y="990" text-anchor="middle" dominant-baseline="central">Redis 8.x</text>
  <text class="ts" x="337" y="1010" text-anchor="middle" dominant-baseline="central">message queue · fail-soft</text>
  <text class="ts" x="337" y="1028" text-anchor="middle" dominant-baseline="central">non-blocking degradation</text>
  <rect x="436" y="966" width="194" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="533" y="990" text-anchor="middle" dominant-baseline="central">LLM gateway</text>
  <text class="ts" x="533" y="1010" text-anchor="middle" dominant-baseline="central">token-factory first (opt-in)</text>
  <text class="ts" x="533" y="1028" text-anchor="middle" dominant-baseline="central">TokenHub fallback · no Mock</text>

  <!-- CROSS-CUTTING -->
  <rect x="40" y="1070" width="600" height="166" rx="14" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="lay" x="56" y="1090" fill="#993556">Cross-cutting concerns (span all six layers)</text>
  <rect x="58" y="1100" width="138" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="127" y="1118" text-anchor="middle" dominant-baseline="central">Multi-tenancy</text>
  <text class="ts" x="127" y="1136" text-anchor="middle" dominant-baseline="central">owner/repo→teamId</text>
  <rect x="208" y="1100" width="138" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="277" y="1118" text-anchor="middle" dominant-baseline="central">Full-chain tracing</text>
  <text class="ts" x="277" y="1136" text-anchor="middle" dominant-baseline="central">traceId=runId MDC</text>
  <rect x="358" y="1100" width="138" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="427" y="1118" text-anchor="middle" dominant-baseline="central">4-level degradation</text>
  <text class="ts" x="427" y="1136" text-anchor="middle" dominant-baseline="central">DegradationChain</text>
  <rect x="508" y="1100" width="124" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="570" y="1118" text-anchor="middle" dominant-baseline="central">Skill plug-ins</text>
  <text class="ts" x="570" y="1136" text-anchor="middle" dominant-baseline="central">SPI registry</text>
  <rect x="58" y="1162" width="200" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="158" y="1180" text-anchor="middle" dominant-baseline="central">Resume &amp; trajectory replay</text>
  <text class="ts" x="158" y="1198" text-anchor="middle" dominant-baseline="central">ResumeStore (runId=repo@headSha)</text>
  <rect x="270" y="1162" width="200" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="370" y="1180" text-anchor="middle" dominant-baseline="central">Prompt injection defense</text>
  <text class="ts" x="370" y="1198" text-anchor="middle" dominant-baseline="central">Steg scan · Diff BLOCK/TAG · store gate</text>
  <rect x="482" y="1162" width="150" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="557" y="1180" text-anchor="middle" dominant-baseline="central">i18n</text>
  <text class="ts" x="557" y="1198" text-anchor="middle" dominant-baseline="central">ReviewMessages</text>

  <text class="cap" x="40" y="1266">Management console code-review-console (:8081) calls engine /api/admin/* with X-Team-Id, see architecture diagram B · custom-agent admin: GET/POST/PUT/DELETE /api/admin/agents · new switches: review.planning.enabled / review.reflection.enabled / review.eval.enabled / review.tools.agent-loop.enabled (default off)</text>
</svg>
